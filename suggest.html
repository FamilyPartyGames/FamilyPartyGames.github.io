<!DOCTYPE html>
<html>
<head>
  <title>Suggest a Game</title>
</head>
<body>

<h1 style="position:absolute; top:25px; left:100px;">
  Suggest a Game
</h1>

<form id="suggestForm">

  <textarea id="message" name="message"
    placeholder="Type your suggestion here..."
    rows="4" cols="40" maxlength="500"
    style="position:absolute; top:100px; left:125px;"></textarea>

  <input type="email" id="user_email" name="user_email"
    placeholder="Your email (optional)"
    style="position:absolute; top:200px; left:125px;"></input>

  <button type="submit"
    style="position:absolute; top:250px; left:125px;">
    Send
  </button>

  <div id="status"
    style="position:absolute; top:300px; left:125px; font-weight:bold;">
  </div>

</form>
<script>
const form = document.getElementById("suggestForm");
const messageBox = document.getElementById("message");
const emailBox = document.getElementById("user_email");
const statusDiv = document.getElementById("status");

const MAX_LENGTH = 500;
const TIME_LIMIT = 86400000; // 1 day

function validate() {
  const message = messageBox.value.trim();

  if (message.length === 0) {
    statusDiv.style.color = "red";
    statusDiv.textContent = "Message cannot be empty.";
    return false;
  }

  if (message.length > MAX_LENGTH) {
    statusDiv.style.color = "red";
    statusDiv.textContent = "Message must be under 500 characters.";
    return false;
  }

  const lastSubmit = localStorage.getItem("lastSubmitTime");
  const now = Date.now();

  if (lastSubmit && now - lastSubmit < TIME_LIMIT) {
    statusDiv.style.color = "red";
    statusDiv.textContent =
      "Please wait a day before sending another suggestion.";
    return false;
  }

  statusDiv.textContent = "";
  return true;
}

// Live validation while typing
messageBox.addEventListener("input", validate);

// Submit without page reload
form.addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!validate()) return;

  try {
    const response = await fetch("/submit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: messageBox.value,
        user_email: emailBox.value
      })
    });

    const text = await response.text();

    if (response.ok) {
      statusDiv.style.color = "green";
      statusDiv.textContent = "Suggestion received! Thanks 👍";
      localStorage.setItem("lastSubmitTime", Date.now());
      messageBox.value = "";
      emailBox.value = "";
    } else {
      statusDiv.style.color = "red";
      statusDiv.textContent = text;
    }

  } catch (error) {
    statusDiv.style.color = "red";
    statusDiv.textContent = "Server error. Try again later.";
  }
});
</script>



</body>
</html>
